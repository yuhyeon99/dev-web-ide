spring.application.name=dev-web-ide

server.port=${SERVER_PORT:8080}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

app.project.storage-root=${APP_PROJECT_STORAGE_ROOT:/app/storage}
app.storage.project-root=${APP_PROJECT_STORAGE_ROOT:/app/storage}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:https://d15mkrht7zfcoy.cloudfront.net/api/auth/oauth/google/callback}
app.oauth.google.frontend-redirect-uri=${GOOGLE_OAUTH_FRONTEND_REDIRECT_URI:https://d1qcnjd8lnakb.cloudfront.net}
app.oauth.google.authorization-uri=${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
app.oauth.google.token-uri=${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
app.oauth.google.user-info-uri=${GOOGLE_OAUTH_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}

app.redis.enabled=${APP_REDIS_ENABLED:false}
app.redis.project-events-channel=${APP_REDIS_PROJECT_EVENTS_CHANNEL:dev-web-ide:project-events}
app.redis.crdt-updates-channel=${APP_REDIS_CRDT_UPDATES_CHANNEL:dev-web-ide:crdt-updates}
app.redis.chat-messages-channel=${APP_REDIS_CHAT_MESSAGES_CHANNEL:dev-web-ide:chat-messages}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
