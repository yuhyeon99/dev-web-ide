spring.application.name=dev-web-ide

server.port=${SERVER_PORT:8080}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

app.project.storage-root=${APP_PROJECT_STORAGE_ROOT:/app/storage}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
