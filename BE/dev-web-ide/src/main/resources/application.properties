spring.application.name=dev-web-ide
app.jwt.secret=devwebide-local-development-secret-key-for-jwt-access-token
app.jwt.access-token-expiration-minutes=30
# DB Setting
spring.datasource.url=jdbc:mysql://localhost:3306/dev-web-ide
spring.datasource.username=root
spring.datasource.password=1234

# [JPA Setting]
# DB ??? ?? ??/??
spring.jpa.hibernate.ddl-auto=update
# ??? ?? SQL ??
spring.jpa.show-sql=true
# SQL? ?? ?? ??
spring.jpa.properties.hibernate.format_sql=true
app.project.storage-root=./storage
app.storage.project-root=./storage
app.cors.allowed-origins=http://localhost:5173

# Google OAuth 로컬 개발 기본값
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
app.oauth.google.frontend-redirect-uri=${GOOGLE_OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173}
app.oauth.google.authorization-uri=${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
app.oauth.google.token-uri=${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
app.oauth.google.user-info-uri=${GOOGLE_OAUTH_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
