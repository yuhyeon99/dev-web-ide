spring.datasource.url=jdbc:h2:mem:devwebide-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.project.storage-root=./build/test-storage

app.oauth.google.client-id=test-google-client-id
app.oauth.google.client-secret=test-google-client-secret
app.oauth.google.redirect-uri=http://localhost:8080/api/auth/oauth/google/callback
app.oauth.google.frontend-redirect-uri=http://localhost:5173
app.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.oauth.google.token-uri=https://oauth2.googleapis.com/token
app.oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
